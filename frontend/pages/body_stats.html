<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZENFIT — Body Profile</title>

<link rel="stylesheet" href="../css/body_stats.css">

<!-- Font Awesome Icons -->
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
>

</head>


<body>


<header class="header">

<button onclick="history.back()" aria-label="Go Back">
    <i class="fa-solid fa-arrow-left"></i>
</button>

<h1>
    <i class="fa-solid fa-user"></i>
    Body Profile
</h1>

</header>




<main class="container">



<section class="profile-card">



<!-- LEFT -->

<div class="visual-side">


<div class="photo-box">


<img
    id="profilePhoto"
    src="../assets/images/default_user.jpeg"
    alt="Profile Photo"
>


<label for="photoUpload">
    <i class="fa-solid fa-camera"></i>
    Change Photo
</label>


<input
    type="file"
    id="photoUpload"
    accept="image/*"
    hidden
>


</div>



<div class="score-circle">

<strong id="bmiScore">
    0
</strong>

<span>
    BMI
</span>


</div>



</div>





<!-- RIGHT -->

<div class="details-side">


<h2 id="userName">
    User
</h2>


<p class="goal">
    <i class="fa-solid fa-bullseye"></i>
    Goal:

    <span id="userGoal">
        --
    </span>
</p>




<div class="stats-grid">


<div class="stat">

<h4>
    <i class="fa-solid fa-ruler-vertical"></i>
    Height
</h4>

<strong id="height">
    --
</strong>

</div>



<div class="stat">

<h4>
    <i class="fa-solid fa-weight-scale"></i>
    Weight
</h4>

<strong id="weight">
    --
</strong>

</div>



<div class="stat">

<h4>
    <i class="fa-solid fa-calculator"></i>
    BMI
</h4>

<strong id="bmi">
    --
</strong>

</div>



<div class="stat">

<h4>
    <i class="fa-solid fa-fire"></i>
    BMR
</h4>

<strong id="bmr">
    --
</strong>

</div>


</div>





<div class="progress-box">


<h3>
    <i class="fa-solid fa-chart-simple"></i>
    Body Composition
</h3>


<div class="line">

<span>
    Body Fat
</span>

<b id="bodyFat">
    0%
</b>


</div>


<div class="bar">

<div id="fatProgress"></div>

</div>



</div>





<div class="calorie-box">

    <i class="fa-solid fa-fire-flame-curved"></i>
    Daily Calories Need

<strong id="calories">
    0 kcal
</strong>


</div>



</div>



</section>



</main>




<script src="../js/body_stats.js"></script>


</body>

</html>
